<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script>
  /* Reads the saved theme synchronously so the page never flashes the
     wrong one on load. Kept tiny and inline — everything else about
     theming lives in js/theme.js, loaded later like normal. */
  (function () {
    try {
      var saved = localStorage.getItem('untangle:theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.dataset.theme = saved;
      }
    } catch (e) { /* storage unavailable — CSS still falls back to prefers-color-scheme */ }
  })();
</script>

<title>Untangle — Play</title>
<meta name="description" content="Play Untangle: slide every piece off the board, in the right order. Four difficulty levels, always solvable.">

<meta property="og:type" content="website">
<meta property="og:title" content="Untangle — Play">
<meta property="og:description" content="Slide every piece off the board, in the right order.">
<meta property="og:image" content="assets/og-image.svg">

<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F6F5C">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body data-title-key="title_play">
  <div id="app">

    <header class="game-topbar">
      <div class="game-topbar-inner glass-card">
        <a class="btn btn-icon icon-flip" href="index.html" aria-label="Back" data-i18n-attr="aria-label:back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 5 L8 12 L15 19"/>
          </svg>
        </a>

        <a class="topbar-brand" href="index.html">Untangle</a>

        <span class="difficulty-badge" id="difficulty-badge" data-i18n="diff_medium">Medium</span>

        <div class="topbar-actions">
          <button class="btn btn-icon icon-swap" id="hint-btn" type="button" data-i18n-attr="aria-label:hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21 H15"/>
              <path d="M10 18 H14"/>
              <path d="M12 3 C8.5 3 6.5 5.5 6.5 8.3 C6.5 10.4 7.7 11.7 8.8 12.8 C9.5 13.5 10 14.3 10.2 15.5 H13.8 C14 14.3 14.5 13.5 15.2 12.8 C16.3 11.7 17.5 10.4 17.5 8.3 C17.5 5.5 15.5 3 12 3 Z"/>
            </svg>
          </button>

          <button class="btn btn-icon icon-swap" id="theme-toggle-btn" type="button" data-theme-toggle data-i18n-attr="aria-label:theme_dark">
            <svg class="icon-theme-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4.5"/>
              <path d="M12 3 V5.5 M12 18.5 V21 M3 12 H5.5 M18.5 12 H21 M5.6 5.6 L7.3 7.3 M16.7 16.7 L18.4 18.4 M18.4 5.6 L16.7 7.3 M7.3 16.7 L5.6 18.4"/>
            </svg>
            <svg class="icon-theme-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" hidden>
              <path d="M20 14.5 A8.5 8.5 0 1 1 9.5 4 A6.8 6.8 0 0 0 20 14.5 Z"/>
            </svg>
          </button>

          <button class="btn btn-icon icon-swap" id="mute-btn" type="button" data-i18n-attr="aria-label:mute_on">
            <svg class="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 10 V14 H8 L13 18 V6 L8 10 H4 Z"/>
              <path d="M17 9 C18.5 10.5 18.5 13.5 17 15"/>
            </svg>
            <svg class="icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" hidden>
              <path d="M4 10 V14 H8 L13 18 V6 L8 10 H4 Z"/>
              <path d="M16.5 9.5 L21 14 M21 9.5 L16.5 14"/>
            </svg>
          </button>

          <button class="lang-toggle" type="button" data-lang-toggle>العربية</button>
        </div>
      </div>
    </header>

    <section class="hud glass-card">
      <div class="hud-row">
        <div class="progress-block">
          <div class="progress-bar" id="progress-bar-track">
            <div id="progress-fill"></div>
          </div>
          <span id="progress-label">0%</span>
        </div>

        <div class="attempts-block">
          <span class="attempts-caption" data-i18n="attempts">Attempts</span>
          <div id="attempts-dots"></div>
        </div>

        <button class="btn btn-ghost btn-small" id="new-puzzle-btn" type="button" data-i18n="new_puzzle">New Puzzle</button>
      </div>
    </section>

    <main id="board-wrap">
      <div id="board" dir="ltr" role="grid" aria-label="Untangle board" tabindex="0"></div>
      <div id="loading-overlay" class="loading-overlay" aria-hidden="true">
        <div class="loading-spinner"></div>
      </div>
    </main>

    <div id="lose-overlay" class="overlay" hidden>
      <div class="overlay-card glass-card">
        <div class="overlay-icon overlay-icon-warn" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="24" cy="24" r="18"/>
            <path d="M24 15 V26"/>
            <circle cx="24" cy="32.5" r="1.6" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <h2 data-i18n="lose_title">Out of Attempts</h2>
        <p data-i18n="lose_desc">No moves left. Try this board again.</p>
        <button class="btn btn-primary" id="retry-btn" type="button" data-i18n="retry">Retry</button>
      </div>
    </div>

    <div id="win-overlay" class="overlay" hidden>
      <div class="overlay-card glass-card">
        <div class="overlay-icon overlay-icon-win" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="24" cy="24" r="18"/>
            <path d="M16 24 L21.5 29.5 L33 17"/>
          </svg>
        </div>
        <h2 data-i18n="win_title">Board Cleared!</h2>
        <p data-i18n="win_desc">Every piece slid off the board.</p>
        <p class="win-time-line" id="win-time-line"></p>
        <div class="win-actions">
          <button class="btn btn-primary" id="new-level-btn" type="button" data-i18n="new_level">New Level</button>
          <button class="btn btn-ghost" id="share-btn" type="button" data-i18n="share">Share</button>
        </div>
        <p class="share-toast" id="share-toast" data-i18n="share_copied">Copied to clipboard</p>
      </div>
    </div>

  </div>

  <footer class="site-footer">
    <p class="footer-signature">Made by Omar</p>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/game.js"></script>
  <script src="js/sw-register.js"></script>
</body>
</html>
